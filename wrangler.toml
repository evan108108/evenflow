# ── Deploy account (EFB-81) ───────────────────────────────────────────────
#
# Account 0dfbf8a0b8a8c8dca0ca0a1ca25d0962 — evan108108@gmail.com.
# Credentials: `set -a; source /Users/evan/projects/4a/.env; set +a`
#
# The ID is here because the ADJECTIVE is ambiguous and the ID is not. Calling
# this "Evan's personal account" is true, but there are two accounts that
# answer to that description, and `wrangler whoami` on the ambient OAuth token
# lists the OTHER one:
#
#   Enginable                              159ddc1706d598cfcb1feae611ef1a7f
#   Evan.frohlich@enginable.com's Account  88c3dd1a748d4ec20eae209113025f6d
#   evan108108@gmail.com  ← evenflow       0dfbf8a0b8a8c8dca0ca0a1ca25d0962  (NOT listed)
#
# So a deployer reading "personal", running `wrangler whoami`, and picking the
# personal-looking entry lands on 88c3dd — where this Worker does not exist.
# `wrangler deployments list` answers `10007 This Worker does not exist` on
# both listed accounts, which is the good failure. The bad one is `wrangler
# deploy`: against the wrong account it SILENTLY CREATES a second `evenflow`
# Worker that no traffic reaches, and reports success.
#
# Verify before deploying, don't infer:
#   wrangler deployments list   → newest version id should match /healthz
#
name = "evenflow"
main = "src/index.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "evenflow.work", custom_domain = true },
  { pattern = "api.evenflow.work", custom_domain = true }
]

# Observability — send logs to Cloudflare's dashboard
[observability]
enabled = true

# Daily sprint-tide roll-forward (EFB-22). 06:17 UTC — off-peak, and an
# odd minute so we're not sharing Cloudflare's on-the-hour cron surge.
# The read path already closes out a day on the first visit; this exists for
# boards nobody visited, so their history has no gaps. Handler: src/scheduled.ts.
[triggers]
# "17 6 * * *" — nightly tide roll-forward (EFB-22).
# "* * * * *"  — outbound webhook delivery sweep (EFB-13). This is the ONLY
#                thing that POSTs a webhook: the emit path writes pending rows
#                and never calls out, because emitSecureBoardEvent has no
#                ExecutionContext to reach ctx.waitUntil with. If this schedule
#                is removed, outbound webhooks stop entirely — they do not
#                degrade to slow. src/scheduled.ts branches on `event.cron`.
crons = ["17 6 * * *", "* * * * *"]

[vars]
# Default Evenflow-managed Blossom host for issue attachments (phase 18a).
# blossom.band: BUD-01/02 compliant, free, public, no account gate — see
# src/effects/Blossom.ts for the rationale. The BUD-01 signing key lives in
# the EVENFLOW_BLOSSOM_SECRET Worker secret (set via `wrangler secret put`).
# Phase 18b adds a second secret, EVENFLOW_STORAGE_SECRET (32-byte hex):
# derives the static server pubkey that BYO-S3 credentials are
# NIP-44-encrypted to (src/lib/nostr-keys.ts). Deliberately separate from
# the Blossom signing key — no key reuse across schnorr and ECDH.
EVENFLOW_DEFAULT_BLOSSOM_URL = "https://blossom.band"

# Static SPA assets (web/ → dist/web via `cd web && npm run build`).
# Requests matching a built file are served directly; everything else falls
# through to the Worker, whose catch-all GET serves index.html (SPA routing).
[assets]
directory = "./dist/web"
binding = "ASSETS"

# D1 database — cache + config surface (see migrations/README.md).
# On the same account as the Worker — see the deploy-account note at the top
# of this file for the id and why the name alone is not enough to find it.
# Provisioned 2026-07-28 via `wrangler d1 create evenflow`.
[[d1_databases]]
binding = "DB"
database_name = "evenflow"
database_id = "67efa394-dc02-41e3-883a-b2ee885b1190"

# R2 bucket (uncomment after `wrangler r2 bucket create evenflow-artifacts`)
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "evenflow-artifacts"

# Durable Object for per-board SSE fanout — one named instance per board id.
[[durable_objects.bindings]]
name = "BOARD"
class_name = "BoardDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardDO"]
