name = "evenflow"
main = "src/index.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "evenflow.work", custom_domain = true },
  { pattern = "api.evenflow.work", custom_domain = true }
]

# Observability — send logs to Cloudflare's dashboard
[observability]
enabled = true

# Daily sprint-tide roll-forward (EFB-22). 06:17 UTC — off-peak, and an
# odd minute so we're not sharing Cloudflare's on-the-hour cron surge.
# The read path already closes out a day on the first visit; this exists for
# boards nobody visited, so their history has no gaps. Handler: src/scheduled.ts.
[triggers]
crons = ["17 6 * * *"]

[vars]
# Default Evenflow-managed Blossom host for issue attachments (phase 18a).
# blossom.band: BUD-01/02 compliant, free, public, no account gate — see
# src/effects/Blossom.ts for the rationale. The BUD-01 signing key lives in
# the EVENFLOW_BLOSSOM_SECRET Worker secret (set via `wrangler secret put`).
# Phase 18b adds a second secret, EVENFLOW_STORAGE_SECRET (32-byte hex):
# derives the static server pubkey that BYO-S3 credentials are
# NIP-44-encrypted to (src/lib/nostr-keys.ts). Deliberately separate from
# the Blossom signing key — no key reuse across schnorr and ECDH.
EVENFLOW_DEFAULT_BLOSSOM_URL = "https://blossom.band"

# Static SPA assets (web/ → dist/web via `cd web && npm run build`).
# Requests matching a built file are served directly; everything else falls
# through to the Worker, whose catch-all GET serves index.html (SPA routing).
[assets]
directory = "./dist/web"
binding = "ASSETS"

# D1 database — cache + config surface (see migrations/README.md).
# Lives on Evan's personal Cloudflare account (same as evenflow.work + 4a).
# Provisioned 2026-07-28 via `wrangler d1 create evenflow`.
[[d1_databases]]
binding = "DB"
database_name = "evenflow"
database_id = "67efa394-dc02-41e3-883a-b2ee885b1190"

# R2 bucket (uncomment after `wrangler r2 bucket create evenflow-artifacts`)
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "evenflow-artifacts"

# Durable Object for per-board SSE fanout — one named instance per board id.
[[durable_objects.bindings]]
name = "BOARD"
class_name = "BoardDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardDO"]
