<!-- Evenflow butterfly — hand-drawn single continuous stroke (phase 20).
     One <path>, no fills: antenna curl → antennae → upper wing → inner
     wing → lower wing → tail flourish, matching the one-line-drawing
     reference at design-assets/butterfly-logo-ref.jpg. Stroke inherits
     currentColor so the mark takes the ink of whatever surrounds it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" fill="none" role="img" aria-label="Evenflow butterfly">
  <path d="M20 30
           C14 18 30 12 33 22
           C34 28 25 29 24 23
           C30 34 38 42 47 50
           C50 28 62 8 76 6
           C88 4 98 8 94 16
           C86 30 66 44 51 54
           C58 42 70 30 82 26
           C92 22 100 28 94 34
           C83 46 64 53 52 58
           C64 54 84 50 94 58
           C105 68 98 81 85 84
           C70 87 55 77 51 62
           C46 71 41 79 45 85
           C54 92 74 93 90 91
           C100 90 112 89 122 90"
        stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
